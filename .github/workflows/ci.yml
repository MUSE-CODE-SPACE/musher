name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
      - name: end-to-end demo
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          MUSHER=$PWD/target/release/musher sh examples/demo/run-demo.sh
      - name: lifecycle regression (stop/resume/check/hooks/merge/clean)
        run: MUSHER=$PWD/target/release/musher sh tests/regression.sh
