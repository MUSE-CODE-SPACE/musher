name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: install cross (linux)
        if: runner.os == 'Linux'
        run: cargo install cross --locked
      - name: build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Linux ]; then cross build --release --target ${{ matrix.target }}; else cargo build --release --target ${{ matrix.target }}; fi
          tar -czf musher-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release musher
      - uses: softprops/action-gh-release@v2
        with:
          files: musher-${{ matrix.target }}.tar.gz
