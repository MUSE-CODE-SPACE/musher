[package]
name = "musher"
version = "0.3.3"
edition = "2021"
description = "Drive a team of AI coding agents: isolated worktrees, task DAG, verify-and-fix loops, durable event log. One small binary, no server."
license = "MIT"
repository = "https://github.com/MUSE-CODE-SPACE/musher"
readme = "README.md"
keywords = ["ai", "agents", "orchestration", "claude", "codex"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
